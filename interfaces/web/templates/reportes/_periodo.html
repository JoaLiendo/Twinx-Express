{# Formulario de período (desde/hasta); el bloque `call` agrega campos extra antes del botón. #}
{% macro formulario(accion, fecha_desde, fecha_hasta) %}
  <form method="get" action="{{ accion }}" class="flex flex-wrap items-end gap-2">
    <div>
      <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Desde</label>
      <input type="date" name="fecha_desde" value="{{ fecha_desde }}"
             class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white text-slate-900 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Hasta</label>
      <input type="date" name="fecha_hasta" value="{{ fecha_hasta }}"
             class="rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white text-slate-900 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
    </div>
    {{ caller() }}
    <button type="submit" class="rounded-lg bg-slate-900 hover:bg-slate-800 dark:bg-slate-700 dark:hover:bg-slate-600 transition text-white text-sm font-medium px-4 py-2">Filtrar</button>
  </form>
{% endmacro %}
