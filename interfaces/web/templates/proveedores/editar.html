{% extends "base.html" %}

{% block titulo %}Editar proveedor{% endblock %}
{% block header %}<h1 class="text-lg font-semibold tracking-tight text-slate-900 dark:text-slate-100">Editar proveedor</h1>{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
  <div class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <form method="post" action="/proveedores/{{ proveedor.id }}/editar" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Nombre</label>
        <input type="text" name="nombre" required autofocus value="{{ proveedor.nombre }}"
               class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                      dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                      focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Persona de contacto</label>
        <input type="text" name="contacto_nombre" value="{{ proveedor.contacto_nombre or '' }}"
               class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                      dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                      focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Teléfono</label>
          <input type="text" name="telefono" value="{{ proveedor.telefono or '' }}"
                 class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                        dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                        focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Email</label>
          <input type="email" name="email" value="{{ proveedor.email or '' }}"
                 class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                        dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                        focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Dirección</label>
        <input type="text" name="direccion" value="{{ proveedor.direccion or '' }}"
               class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                      dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                      focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Notas</label>
        <textarea name="notas" rows="3"
                  class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                         dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                         focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">{{ proveedor.notas or '' }}</textarea>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="rounded-lg bg-primary hover:bg-primary-hover transition text-white text-sm font-semibold px-5 py-2.5 shadow-sm">
          Guardar cambios
        </button>
        <a href="/proveedores" class="text-sm font-medium text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
