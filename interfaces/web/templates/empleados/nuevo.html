{% extends "base.html" %}

{% block titulo %}Nuevo empleado{% endblock %}
{% block header %}<h1 class="text-lg font-semibold tracking-tight text-slate-900 dark:text-slate-100">Nuevo empleado</h1>{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
  <div class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <form method="post" action="/empleados/nuevo" class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Nombre de usuario</label>
        <input type="text" name="nombre_usuario" required autofocus
               class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                      dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                      focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
        <p class="mt-1.5 text-xs text-slate-400 dark:text-slate-500">No se puede cambiar después de crear el usuario.</p>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Nombre completo</label>
        <input type="text" name="nombre_completo" required
               class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                      dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                      focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Contraseña inicial</label>
        <input type="password" name="password" required
               class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                      dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                      focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Rol</label>
        <select name="rol" required
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900
                       dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                       focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
          <option value="CASHIER">CASHIER (cajero)</option>
          <option value="OWNER">OWNER (dueño)</option>
        </select>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="rounded-lg bg-primary hover:bg-primary-hover transition text-white text-sm font-semibold px-5 py-2.5 shadow-sm">
          Crear empleado
        </button>
        <a href="/empleados" class="text-sm font-medium text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
