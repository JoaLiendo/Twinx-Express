{% extends "base.html" %}

{% block titulo %}Editar categoría{% endblock %}
{% block header %}<h1 class="text-lg font-semibold tracking-tight text-slate-900 dark:text-slate-100">Editar categoría</h1>{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <form method="post" action="/productos/categorias/{{ categoria.id }}/editar" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Nombre</label>
        <input type="text" name="nombre" required autofocus value="{{ categoria.nombre }}"
               class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                      dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                      focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
      </div>
      <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="rounded-lg bg-primary hover:bg-primary-hover transition text-white text-sm font-semibold px-5 py-2.5 shadow-sm">
          Guardar cambios
        </button>
        <a href="/productos/categorias" class="text-sm font-medium text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
