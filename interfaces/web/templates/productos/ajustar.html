{% extends "base.html" %}

{% block titulo %}Ajustar stock{% endblock %}
{% block header %}<h1 class="text-lg font-semibold tracking-tight text-slate-900 dark:text-slate-100">Ajustar stock — {{ producto.nombre }}</h1>{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
  <div class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-5">
      Stock actual: <span class="font-semibold text-slate-900 dark:text-slate-100 tabular-nums">{{ producto.stock_actual }}</span>
    </p>

    <form method="post" action="/productos/{{ producto.id }}/ajustar" class="space-y-5" id="form-ajustar-stock">

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Motivo</label>
        <select name="motivo" id="select-motivo" required
                class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900
                       dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                       focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
          {% for motivo in motivos %}
            <option value="{{ motivo }}">{{ motivo }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Dirección</label>
          <select name="direccion" required
                  class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900
                         dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                         focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary">
            <option value="restar">Restar</option>
            <option value="sumar">Sumar</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Cantidad</label>
          <input type="number" name="cantidad" min="1" step="1" required
                 class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 tabular-nums
                        dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                        focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">
          Observaciones <span id="observaciones-requeridas" class="hidden text-error">(obligatorio para motivo "OTRO")</span>
        </label>
        <textarea name="observaciones" id="textarea-observaciones" rows="3"
                  class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                         dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                         focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary"
                  placeholder="Opcional, salvo para motivo &quot;OTRO&quot;"></textarea>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <button type="submit" class="rounded-lg bg-primary hover:bg-primary-hover transition text-white text-sm font-semibold px-5 py-2.5 shadow-sm">
          Registrar ajuste
        </button>
        <a href="/productos/{{ producto.id }}/editar" class="text-sm font-medium text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Ayuda visual únicamente -- la regla real (OTRO exige observaciones)
  // se valida siempre en el servidor (services.servicio_stock.ajustar_stock),
  // esto solo evita un viaje al servidor para el caso más común.
  const selectMotivo = document.getElementById('select-motivo');
  const textareaObservaciones = document.getElementById('textarea-observaciones');
  const avisoObligatorio = document.getElementById('observaciones-requeridas');

  function actualizarObligatoriedad() {
    const esOtro = selectMotivo.value === 'OTRO';
    textareaObservaciones.required = esOtro;
    avisoObligatorio.classList.toggle('hidden', !esOtro);
  }

  selectMotivo.addEventListener('change', actualizarObligatoriedad);
  actualizarObligatoriedad();
</script>
{% endblock %}
