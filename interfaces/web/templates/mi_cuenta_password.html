{% extends "base.html" %}

{% block titulo %}Mi cuenta{% endblock %}
{% block header %}<h1 class="text-lg font-semibold tracking-tight text-slate-900 dark:text-slate-100">Cambiar mi contraseña</h1>{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="rounded-2xl border border-slate-200 bg-white p-5 sm:p-8 shadow-sm dark:border-slate-800 dark:bg-slate-900">
    <p class="text-sm text-slate-500 dark:text-slate-400 mb-6">
      Sesión actual: <span class="font-semibold text-slate-800 dark:text-slate-200">@{{ usuario_actual.nombre_usuario }}</span>
    </p>
    <form method="post" action="/mi-cuenta/password" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Contraseña actual</label>
        <input type="password" name="password_actual" required autofocus
               class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                      dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                      focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1.5">Contraseña nueva</label>
        <input type="password" name="password_nueva" required
               class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm bg-white text-slate-900 placeholder:text-slate-400
                      dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100
                      focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
      </div>
      <button type="submit" class="rounded-lg bg-primary hover:bg-primary-hover transition text-white text-sm font-semibold px-5 py-2.5 shadow-sm">
        Cambiar contraseña
      </button>
    </form>
  </div>
</div>
{% endblock %}
